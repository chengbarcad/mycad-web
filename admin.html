<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCAD-APP - 客戶與權限管理後台</title>
    <!-- 引入 Supabase JS 套件 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-canvas: #121212;
            --surface-card: #1a1a1a;
            --text-main: #f0f3f6;
            --text-muted: #95a5a6;
            --bronze-accent: #c09159;
            --bronze-hover: #d4a36b;
            --bronze-tint: rgba(192, 145, 89, 0.08);
            --border-architect: #2d2d2d;
            --danger-color: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            padding: 2.5rem;
        }

        .container { max-width: 900px; margin: 0 auto; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; background: var(--surface-card); padding: 1.5rem 2rem;
            border: 1px solid var(--border-architect); border-radius: 4px;
        }
        h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: 1px; color: var(--text-main); }
        
        .card {
            background: var(--surface-card); border: 1px solid var(--border-architect);
            border-radius: 4px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-main); font-weight: 500; }

        .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; font-family: monospace; }
        .form-control { 
            width: 100%; padding: 0.65rem 0.9rem; 
            background: var(--bg-canvas); border: 1px solid var(--border-architect); 
            border-radius: 4px; font-size: 0.9rem; outline: none; color: var(--text-main); 
        }
        .form-control:focus { border-color: var(--bronze-accent); }

        .btn {
            padding: 0.65rem 1.25rem; background-color: var(--bronze-accent); color: #121212;
            border: none; border-radius: 4px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background-color: var(--bronze-hover); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { background-color: #c0392b; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--surface-card); }
        th, td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border-architect); font-size: 0.9rem; }
        th { background-color: #161616; color: var(--text-muted); font-family: monospace; font-size: 0.8rem; text-transform: uppercase; }
        
        .msg { font-size: 0.85rem; margin-top: 0.75rem; }
        .success { color: #2ecc71; }
        .error { color: var(--danger-color); }
        code { color: var(--bronze-accent); font-family: monospace; }
    </style>
</head>
<body>

    <!-- 後台登入驗證畫面 -->
    <div id="adminLoginBox" class="container" style="max-width: 400px; margin-top: 5rem;">
        <div class="card">
            <h2>管理員後台驗證</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem;">請輸入資料庫中 admin 帳號的密碼</p>
            <div class="form-group">
                <label>管理員密碼 (Admin Password)</label>
                <input type="password" id="adminPasswordInput" class="form-control" placeholder="請輸入密碼">
            </div>
            <button class="btn" style="width: 100%; margin-top: 0.5rem;" onclick="verifyAdmin()">驗證並進入</button>
            <div id="loginError" class="msg error" style="text-align: center;"></div>
        </div>
    </div>

    <!-- 後台管理主畫面 -->
    <div id="adminMainContent" class="container" style="display: none;">
        <header>
            <h1>MyCAD-APP 客戶權限管理後台</h1>
            <a href="index.html" style="color: var(--bronze-accent); text-decoration: none; font-size: 0.9rem; font-weight: 600;">← 返回首頁</a>
        </header>

        <!-- 新增客戶區塊 -->
        <div class="card">
            <h2>新增客戶帳號與密碼</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>帳號 (Username)</label>
                    <input type="text" id="newUsername" class="form-control" placeholder="例如: user02">
                </div>
                <div class="form-group">
                    <label>姓名 / 公司名稱 (Full Name)</label>
                    <input type="text" id="newFullName" class="form-control" placeholder="例如: 張工程師">
                </div>
                <div class="form-group">
                    <label>密碼 (Password)</label>
                    <input type="text" id="newPassword" class="form-control" placeholder="設定登入密碼">
                </div>
            </div>
            <button class="btn" onclick="addClient()">新增客戶至資料庫</button>
            <div id="addMsg" class="msg"></div>
        </div>

        <!-- 客戶列表清單 -->
        <div class="card">
            <h2>目前客戶列表</h2>
            <table>
                <thead>
                    <tr>
                        <th>帳號</th>
                        <th>姓名 / 公司</th>
                        <th>密碼</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">正在載入資料...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hqjwohytsberbeyisewq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_iNASGZHnISSXXY9Egnw7TA_dAvzCSO1';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function verifyAdmin() {
            const inputVal = document.getElementById('adminPasswordInput').value.trim();
            const errBox = document.getElementById('loginError');
            errBox.textContent = '';

            if (!inputVal) {
                errBox.textContent = '請輸入密碼';
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('profiles')
                    .select('*')
                    .eq('username', 'admin')
                    .single();

                if (error || !data) {
                    errBox.textContent = '資料庫中找不到 admin 帳號！';
                    return;
                }

                if (data.pws === inputVal) {
                    document.getElementById('adminLoginBox').style.display = 'none';
                    document.getElementById('adminMainContent').style.display = 'block';
                    fetchClients();
                } else {
                    errBox.textContent = '管理員密碼錯誤！';
                }
            } catch (err) {
                errBox.textContent = '驗證過程發生連線異常';
            }
        }

        async function fetchClients() {
            const tbody = document.getElementById('clientTableBody');
            const { data, error } = await _supabase.from('profiles').select('*');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger-color);">載入失敗: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">目前資料庫沒有客戶記錄。</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(client => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${client.username}</b></td>
                    <td>${client.full_name || '-'}</td>
                    <td><code>${client.pws || '-'}</code></td>
                    <td><span style="color: #2ecc71;">${client.is_active ? '啟用中' : '已停用'}</span></td>
                    <td><button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="deleteClient('${client.id}')">刪除</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addClient() {
            const username = document.getElementById('newUsername').value.trim();
            const fullName = document.getElementById('newFullName').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const msgBox = document.getElementById('addMsg');
            msgBox.textContent = '';

            if (!username || !password) {
                msgBox.className = 'msg error';
                msgBox.textContent = '帳號與密碼不得為空！';
                return;
            }

            const { error } = await _supabase.from('profiles').insert([
                { 
                    username: username, 
                    full_name: fullName, 
                    pws: password, 
                    is_active: true 
                }
            ]);

            if (error) {
                msgBox.className = 'msg error';
                msgBox.textContent = `新增失敗: ${error.message}`;
            } else {
                msgBox.className = 'msg success';
                msgBox.textContent = '成功新增客戶與密碼！';
                document.getElementById('newUsername').value = '';
                document.getElementById('newFullName').value = '';
                document.getElementById('newPassword').value = '';
                await fetchClients();
            }
        }

        async function deleteClient(id) {
            if (!confirm('確定要刪除這位客戶的資料嗎？')) return;

            const { error } = await _supabase.from('profiles').delete().eq('id', id);
            if (error) {
                alert(`刪除失敗: ${error.message}`);
            } else {
                fetchClients();
            }
        }
    </script>
</body>
</html>
