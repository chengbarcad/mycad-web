<!-- 在 <head> 中引入 Supabase 官方連線工具 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 初始化 Supabase 連線 (填入您專案的網址與公開 Anon Key)
    const SUPABASE_URL = '您的專案網址 (https://xxxx.supabase.co)';
    const SUPABASE_ANON_KEY = '您的專案金鑰 (eyJhbGci...)';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 處理雲端登入
    async function handleLogin() {
        const uInput = document.getElementById('usernameInput').value.trim();
        const pInput = document.getElementById('inputPassword').value.trim();
        const errBox = document.getElementById('errorMsg');
        errBox.textContent = '';

        if (!uInput || !pInput) {
            errBox.textContent = '帳號與密碼不得為空';
            return;
        }

        try {
            // 透過 Supabase 進行安全身分驗證
            // (註冊時我們會把 username 對應到 email 格式如 username@mycad.internal)
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: `${uInput}@mycad.internal`,
                password: pInput
            });

            if (error) throw error;

            // 登入成功，取得使用者姓名與權限
            const user = data.user;
            activateLoginUI(user.user_metadata.full_name || uInput);

        } catch (error) {
            errBox.textContent = '帳號或密碼錯誤，或帳號已被停用';
        }
    }
</script>
