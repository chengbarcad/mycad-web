<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCAD-APP - AutoLISP 工具庫</title>
    <!-- 引入 Supabase JS 套件 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-canvas: #121212;
            --surface-card: #1a1a1a;
            --text-main: #f0f3f6;
            --text-muted: #95a5a6;
            --bronze-accent: #c09159;
            --bronze-hover: #d4a36b;
            --bronze-tint: rgba(192, 145, 89, 0.08);
            --border-architect: #2d2d2d;
            --header-height: 75px;
            --sidebar-width: 300px;
            --danger-color: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background-color: rgba(18, 18, 18, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-architect);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2.5rem; z-index: 1000;
        }
        .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
        .brand-indicator { width: 10px; height: 10px; background-color: var(--bronze-accent); box-shadow: 0 0 8px var(--bronze-accent); }
        .brand span { color: var(--bronze-accent); }
        .header-meta { font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }

        .layout-container { display: flex; margin-top: var(--header-height); flex: 1; }

        /* 左側登入面板 */
        aside {
            width: var(--sidebar-width); background-color: var(--surface-card);
            border-right: 1px solid var(--border-architect); padding: 2rem 1.5rem;
            position: fixed; top: var(--header-height); bottom: 0; left: 0; overflow-y: auto; z-index: 999;
        }
        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 1rem; border-left: 2px solid var(--text-muted); padding-left: 8px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; font-family: monospace; }
        .form-control { 
            width: 100%; padding: 0.65rem 0.9rem; 
            background: var(--bg-canvas); border: 1px solid var(--border-architect); 
            border-radius: 4px; font-size: 0.9rem; outline: none; color: var(--text-main); 
        }
        .form-control:focus { border-color: var(--bronze-accent); }
        .btn {
            width: 100%; padding: 0.65rem; background-color: var(--bronze-accent); color: #121212;
            border: none; border-radius: 4px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background-color: var(--bronze-hover); }
        .error-msg { color: var(--danger-color); font-size: 0.8rem; margin-top: 0.5rem; }
        
        .user-panel { background: var(--bronze-tint); padding: 1rem; border-radius: 4px; border: 1px solid rgba(192, 145, 89, 0.2); margin-bottom: 1.5rem; }
        .user-panel h4 { font-size: 0.95rem; margin-bottom: 0.3rem; color: var(--text-main); }
        .user-panel p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .logout-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: 600; font-size: 0.8rem; }

        /* 右側主畫面 */
        main { margin-left: var(--sidebar-width); flex: 1; padding: 3rem; max-width: calc(100% - var(--sidebar-width)); }
        .hero-banner {
            background: linear-gradient(135deg, var(--surface-card) 0%, var(--bronze-tint) 100%);
            border: 1px solid var(--border-architect); padding: 2rem 2.5rem; border-radius: 4px; margin-bottom: 2rem;
        }
        .hero-banner h1 { font-size: 1.6rem; font-weight: 500; margin-bottom: 0.4rem; color: var(--text-main); }
        .hero-banner p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
        .search-box { width: 100%; max-width: 450px; padding: 0.75rem 1rem; background: var(--bg-canvas); border: 1px solid var(--border-architect); border-radius: 4px; font-size: 0.9rem; outline: none; color: var(--text-main); }
        .search-box:focus { border-color: var(--bronze-accent); }

        .architect-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .architect-card {
            background-color: var(--surface-card); border: 1px solid var(--border-architect);
            border-radius: 4px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s ease;
        }
        .architect-card:hover { transform: translateY(-3px); border-color: var(--bronze-accent); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6); }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .card-tag { font-size: 0.7rem; font-family: monospace; color: var(--bronze-accent); text-transform: uppercase; }
        .download-count { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; background: var(--bg-canvas); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-architect); }
        .architect-card h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main); }
        .architect-card p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 1.25rem; }
        
        .download-btn {
            display: none; text-align: center; padding: 0.6rem 1rem; background-color: var(--bronze-tint);
            color: var(--bronze-accent); border: 1px solid rgba(192, 145, 89, 0.3); text-decoration: none;
            font-size: 0.85rem; border-radius: 3px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            font-family: monospace;
        }
        .download-btn:hover { background-color: var(--bronze-accent); color: #121212; }

        body.logged-in .download-btn { display: block; }

        @media (max-width: 768px) { aside { position: relative; width: 100%; height: auto; } main { margin-left: 0; max-width: 100%; padding: 1.5rem; } }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-indicator"></div>
            MYCAD<span>-APP</span>
        </div>
        <div class="header-meta" id="headerStatus">系統狀態：訪客瀏覽 (未登入)</div>
    </header>

    <div class="layout-container">
        <!-- 左側：登入面板 -->
        <aside>
            <div class="nav-section-title">Member Authentication</div>
            
            <div id="loginSection">
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">請輸入您的帳號與密碼</p>
                <div class="form-group">
                    <label>帳號 (Username)</label>
                    <input type="text" id="usernameInput" class="form-control" placeholder="例如: admin">
                </div>
                <div class="form-group">
                    <label>密碼 (Password)</label>
                    <input type="password" id="passwordInput" class="form-control" placeholder="請輸入密碼">
                </div>
                <button class="btn" onclick="handleLogin()">登入系統</button>
                <div id="errorMsg" class="error-msg"></div>
            </div>

            <div id="userPanelSection" style="display: none;">
                <div class="user-panel">
                    <h4 id="welcomeName"></h4>
                    <p>權限：已驗證會員</p>
                    <button class="logout-btn" onclick="handleLogout()">登出系統</button>
                </div>
            </div>
        </aside>

        <!-- 右側：主內容與工具清單 -->
        <main>
            <div class="hero-banner">
                <h1>AutoLISP 專業工具庫</h1>
                <p>所有工具清單公開瀏覽中。登入後可直接下載對應的 `.fas` 程式檔案。</p>
                <input type="text" id="searchInput" class="search-box" placeholder="搜尋工具關鍵字..." onkeyup="filterTools()">
            </div>

            <div class="architect-grid" id="toolGrid"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://hqjwohytsberbeyisewq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_iNASGZHnISSXXY9Egnw7TA_dAvzCSO1';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allTools = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadToolsData();
            checkSession();
        });

        async function loadToolsData() {
            try {
                const response = await fetch('tools.json');
                allTools = await response.json();
                renderCards(allTools);
            } catch (error) {
                document.getElementById('toolGrid').innerHTML = '<p style="color:var(--danger-color);">無法載入 tools.json 設定檔。</p>';
            }
        }

        function renderCards(tools) {
            const grid = document.getElementById('toolGrid');
            grid.innerHTML = '';

            tools.forEach(tool => {
                let count = localStorage.getItem(`mycad_download_${tool.id}`) || 0;

                const card = document.createElement('div');
                card.className = 'architect-card';
                card.setAttribute('data-name', tool.name);
                card.innerHTML = `
                    <div>
                        <div class="card-header-flex">
                            <span class="card-tag">${tool.category} // ${tool.code}</span>
                            <span class="download-count" id="count-${tool.id}">下載: ${count} 次</span>
                        </div>
                        <h3>${tool.name}</h3>
                        <p>${tool.description}</p>
                    </div>
                    <button class="download-btn" onclick="checkAndDownload('${tool.id}', '${tool.filename}')">下載 ${tool.filename}</button>
                `;
                grid.appendChild(card);
            });
        }

        function checkSession() {
            const savedName = sessionStorage.getItem('mycad_logged_name');
            if (savedName) {
                activateLoginUI(savedName);
            }
        }

        async function handleLogin() {
            const uInput = document.getElementById('usernameInput').value.trim();
            const pInput = document.getElementById('passwordInput').value.trim();
            const errBox = document.getElementById('errorMsg');
            errBox.textContent = '';

            if (!uInput || !pInput) {
                errBox.textContent = '請輸入帳號與密碼';
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('profiles')
                    .select('*')
                    .eq('username', uInput)
                    .eq('is_active', true)
                    .single();

                if (error || !data) {
                    errBox.textContent = '查無此帳號或帳號未啟用';
                    return;
                }

                if (data.pws !== pInput) {
                    errBox.textContent = '密碼錯誤！';
                    return;
                }

                const displayName = data.full_name || data.username;
                sessionStorage.setItem('mycad_logged_name', displayName);
                activateLoginUI(displayName);

            } catch (err) {
                errBox.textContent = '登入驗證發生錯誤';
            }
        }

        function activateLoginUI(name) {
            document.body.classList.add('logged-in');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('userPanelSection').style.display = 'block';
            document.getElementById('welcomeName').textContent = `歡迎，${name}`;
            document.getElementById('headerStatus').textContent = `已驗證身分：${name}`;
        }

        function handleLogout() {
            sessionStorage.removeItem('mycad_logged_name');
            document.body.classList.remove('logged-in');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('userPanelSection').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('headerStatus').textContent = '系統狀態：訪客瀏覽 (未登入)';
        }

        async function checkAndDownload(toolId, fileName) {
            try {
                const response = await fetch(fileName, { method: 'HEAD' });
                if (response.ok) {
                    let count = parseInt(localStorage.getItem(`mycad_download_${toolId}`) || 0) + 1;
                    localStorage.setItem(`mycad_download_${toolId}`, count);
                    document.getElementById(`count-${toolId}`).textContent = `下載: ${count} 次`;

                    const link = document.createElement('a');
                    link.href = fileName;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    alert(`找不到檔案：${fileName}`);
                }
            } catch (error) {
                alert('連線異常');
            }
        }

        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.architect-card').forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
