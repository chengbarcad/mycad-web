<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCAD-APP - 自動化工具庫</title>
    <style>
        :root {
            --bg-canvas: #f0f3f6;
            --surface-white: #ffffff;
            --steel-dark: #2c3e50;
            --steel-silver: #7f8c8d;
            --glass-blue: #3498db;
            --glass-blue-tint: rgba(52, 152, 219, 0.06);
            --border-architect: #dcdde1;
            --header-height: 75px;
            --sidebar-width: 270px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--steel-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-architect);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2.5rem; z-index: 1000;
        }
        .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: var(--steel-dark); display: flex; align-items: center; gap: 12px; }
        .brand-indicator { width: 10px; height: 10px; background-color: var(--glass-blue); box-shadow: 0 0 8px var(--glass-blue); }
        .brand span { color: var(--glass-blue); }
        .header-meta { font-size: 0.85rem; color: var(--steel-silver); font-family: monospace; }

        .layout-container { display: flex; margin-top: var(--header-height); flex: 1; }

        sidebar {
            width: var(--sidebar-width); background-color: var(--surface-white);
            border-right: 1px solid var(--border-architect); padding: 2.5rem 1.5rem;
            position: fixed; top: var(--header-height); bottom: 0; left: 0; overflow-y: auto; z-index: 999;
        }
        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--steel-silver); margin-bottom: 1.25rem; border-left: 2px solid var(--steel-silver); padding-left: 8px; }
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
        .nav-list li button {
            width: 100%; background: none; border: 1px solid transparent;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.85rem 1rem; color: var(--steel-dark); text-align: left;
            font-size: 0.9rem; border-radius: 2px; cursor: pointer; transition: all 0.25s ease;
        }
        .nav-list li button:hover, .nav-list li button.active {
            background-color: var(--glass-blue-tint); color: var(--glass-blue); border-color: rgba(52, 152, 219, 0.3);
        }

        main { margin-left: var(--sidebar-width); flex: 1; padding: 3rem; max-width: calc(100% - var(--sidebar-width)); }
        .hero-banner {
            background: linear-gradient(135deg, var(--surface-white) 0%, var(--glass-blue-tint) 100%);
            border: 1px solid var(--border-architect); padding: 2.5rem; border-radius: 4px; margin-bottom: 2rem;
        }
        .hero-banner h1 { font-size: 1.8rem; font-weight: 500; margin-bottom: 0.5rem; }
        .hero-banner p { color: var(--steel-silver); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .search-box { width: 100%; max-width: 500px; padding: 0.85rem 1.2rem; border: 1px solid var(--border-architect); border-radius: 4px; font-size: 0.95rem; outline: none; background: var(--surface-white); }

        .architect-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .architect-card {
            background-color: var(--surface-white); border: 1px solid var(--border-architect);
            border-radius: 4px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s ease;
        }
        .architect-card:hover { transform: translateY(-3px); border-color: var(--glass-blue); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.08); }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .card-tag { font-size: 0.7rem; font-family: monospace; color: var(--glass-blue); text-transform: uppercase; }
        .download-count { font-size: 0.75rem; color: var(--steel-silver); font-family: monospace; background: #f8f9fa; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-architect); }
        .architect-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .architect-card p { color: var(--steel-silver); font-size: 0.88rem; line-height: 1.5; margin-bottom: 1.25rem; }
        
        .download-btn {
            text-align: center; padding: 0.6rem 1rem; background-color: var(--glass-blue-tint);
            color: var(--glass-blue); border: 1px solid rgba(52, 152, 219, 0.3); text-decoration: none;
            font-size: 0.85rem; border-radius: 3px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .download-btn:hover { background-color: var(--glass-blue); color: white; }

        @media (max-width: 768px) { sidebar { transform: translateX(-100%); } main { margin-left: 0; max-width: 100%; padding: 1.5rem; } }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-indicator"></div>
            MYCAD<span>-APP</span>
        </div>
        <div class="header-meta">
            AUTO-GENERATED SYSTEM // LISP TOOLS
        </div>
    </header>

    <div class="layout-container">
        <sidebar>
            <div class="nav-section-title">Tool Categories</div>
            <ul class="nav-list">
                <li><button class="active" onclick="filterCategory('all', this)">全部工具庫 <span>[ALL]</span></button></li>
                <li><button onclick="filterCategory('architectural', this)">建築製圖模組 <span>[ARC]</span></button></li>
                <li><button onclick="filterCategory('geometry', this)">幾何與標註 <span>[DIM]</span></button></li>
                <li><button onclick="filterCategory('utility', this)">資料與計算 <span>[UTL]</span></button></li>
            </ul>
        </sidebar>

        <main>
            <div class="hero-banner">
                <h1>AutoLISP 專業工具庫（動態自動生成）</h1>
                <p>上傳檔案並更新設定檔後，網頁會自動渲染卡片，支援下載統計與檔案檢查。</p>
                <input type="text" id="searchInput" class="search-box" placeholder="輸入關鍵字搜尋工具..." onkeyup="filterTools()">
            </div>

            <!-- 卡片會由 JavaScript 自動填入這裡 -->
            <div class="architect-grid" id="toolGrid"></div>
        </main>
    </div>

    <script>
        let allTools = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadToolsData();
        });

        // 自動讀取 tools.json 並生成卡片
        async function loadToolsData() {
            try {
                const response = await fetch('tools.json');
                allTools = await response.json();
                renderCards(allTools);
            } catch (error) {
                document.getElementById('toolGrid').innerHTML = '<p style="color:red;">無法載入 tools.json 設定檔，請確認是否已建立。</p>';
            }
        }

        function renderCards(tools) {
            const grid = document.getElementById('toolGrid');
            grid.innerHTML = '';

            tools.forEach(tool => {
                let count = localStorage.getItem(`mycad_download_${tool.id}`) || 0;

                const card = document.createElement('div');
                card.className = 'architect-card';
                card.setAttribute('data-category', tool.category);
                card.setAttribute('data-name', tool.name);
                card.innerHTML = `
                    <div>
                        <div class="card-header-flex">
                            <span class="card-tag">${tool.category} // ${tool.code}</span>
                            <span class="download-count" id="count-${tool.id}">下載: ${count} 次</span>
                        </div>
                        <h3>${tool.name}</h3>
                        <p>${tool.description}</p>
                    </div>
                    <button class="download-btn" onclick="checkAndDownload('${tool.id}', '${tool.filename}')">下載程式 (.fas)</button>
                `;
                grid.appendChild(card);
            });
        }

        async function checkAndDownload(toolId, fileName) {
            try {
                const response = await fetch(fileName, { method: 'HEAD' });

                if (response.ok) {
                    let count = parseInt(localStorage.getItem(`mycad_download_${toolId}`) || 0) + 1;
                    localStorage.setItem(`mycad_download_${toolId}`, count);
                    document.getElementById(`count-${toolId}`).textContent = `下載: ${count} 次`;

                    const link = document.createElement('a');
                    link.href = fileName;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    alert(`【系統提示】找不到檔案：${fileName}，請確認是否已上傳至根目錄！`);
                }
            } catch (error) {
                alert(`【提示】網路或路徑連線異常。`);
            }
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.nav-list button').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const cards = document.querySelectorAll('.architect-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.architect-card').forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
